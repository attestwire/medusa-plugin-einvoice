# CI for the future standalone repo.
#
# The Node matrix is not decoration. `@attestwire/en16931` is an ESM-only
# package and a Medusa plugin compiles to CommonJS, so the plugin depends on
# Node's `require(esm)` support — unflagged from 20.19.0 and 22.12.0, which is
# exactly the `engines` range Medusa 2.19 declares. The two floor versions are
# in the matrix so that dependency stays proven rather than assumed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.12.0", "24.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (mapping + validation)
        run: npm test

      - name: Prove require(esm) works on this Node
        run: node -e "const m=require('@attestwire/en16931'); if(typeof m.validateInput!=='function') process.exit(1)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci
      - name: Build the plugin
        run: npx medusa plugin:build

      # The migration is what makes `npx medusa db:migrate` do anything in a
      # consuming app. Shipping a build without it installs a plugin whose
      # table never gets created, and the failure only shows up at the first
      # order. So the compiled migration is asserted, not assumed.
      - name: Prove the migration is compiled and requireable
        run: |
          node -e "
            const { glob } = require('glob');
            const files = glob.sync('.medusa/server/src/modules/einvoice/migrations/Migration*.js');
            if (!files.length) throw new Error('no compiled migration in the build output');
            for (const f of files) {
              const m = require('./' + f);
              const cls = Object.values(m).find((v) => typeof v === 'function');
              if (!cls) throw new Error('migration ' + f + ' exports no class');
            }
            console.log('compiled migrations OK:', files.join(', '));
          "

      - name: Check the published file list
        run: npm pack --dry-run

      - name: Prove the migration is in the tarball
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const p = require('/tmp/pack.json')[0];
            const hit = p.files.some((f) => /modules\/einvoice\/migrations\/Migration.*\.js\$/.test(f.path));
            if (!hit) throw new Error('the published tarball contains no migration');
            console.log('migration present in tarball');
          "
